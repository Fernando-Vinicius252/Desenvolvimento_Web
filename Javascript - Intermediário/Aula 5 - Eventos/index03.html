<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo título</title>

    <script>
        function loaded() {
            let t = document.getElementById("título")

            // t.onclick = mudarText;
            t.addEventListener("mouseover", mudarText)
            t.addEventListener("mouseout", mouseout)
        }

        function mudarText(){
            this.innerHTML = "Novo Texto";
        }

        function mouseout(){
            this.innerHTML = "Mouse fora";
        }




    </script>

</head>

<body onload="loaded()">
    <h1 id="título">teste</h1>
</body>

</html>
