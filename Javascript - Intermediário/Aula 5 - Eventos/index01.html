<!DOCTYPE html>
<html lang="pt-br" id="01">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo título</title>

    <script>

        function h1click(){
            console.log("Executando a função")
        }

        function changeH1(){
            let input = document.getElementById("texto")
            let h1 = document.getElementsByTagName("h1")[1]
            h1.innerText = input.value;
        }

        function hideH1(){
            let h1 = document.getElementsByTagName("h1")[2]
            h1.style.display = "none";
        }
    </script>

    <style>
        div{
            display: inline-block;
            padding: 20px;
            font-size: 2rem;
            background-color: cornflowerblue;
            color: aliceblue;
        }
    </style>

</head>

<body>
    <h1 onclick="this.style.color = 'red'">Clique em mim</h1>
    <h1 onclick="h1click()">Clique em mim</h1>
    <h1>Clique em mim</h1>

    <input id="texto" type="text" oninput="changeH1()"> 

    <div onclick="hideH1()">Click</div>
</body>

</html>
