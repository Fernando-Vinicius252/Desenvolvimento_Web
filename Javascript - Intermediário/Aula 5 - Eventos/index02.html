<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo título</title>

    <script>
        function onOver(elemento){
            elemento.style.backgroundColor = "red"
        }

        function OnOut(elemento){
            elemento.style.backgroundColor = "cornflowerblue"
        }
    </script>

    <style>
        img{
            width: 200px;
            margin-bottom: 25px;
        }

        div{
            display: inline;
            padding: 10px;
            font-size: 2rem;
            background-color: cornflowerblue;
            color: aliceblue;
        }
    </style>

</head>
<body onload="console.log('Pagina completamente carregada')">
    <img src="https://pt.quizur.com/_image?href=https://img.quizur.com/f/img629626f4a82437.85699243.jpg?lastEdited=1654007543&w=1024&h=1024&f=webp" alt="">   
    <br>
    <div onmouseover="onOver(this)" onmouseout="OnOut(this)">Click</div> 
</body>
</html>
